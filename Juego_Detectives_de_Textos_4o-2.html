<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detectives de textos - 4° grado</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:linear-gradient(135deg,#eef7ff,#fff7e6);color:#243447}
.container{max-width:900px;margin:auto;padding:24px}
.card{background:white;border-radius:24px;padding:28px;box-shadow:0 8px 30px #0001}
h1{text-align:center;color:#2457a6;margin-bottom:8px}
.subtitle{text-align:center;font-size:18px}
.badge{display:inline-block;background:#e8f0ff;padding:8px 14px;border-radius:20px;font-weight:bold}
.example{font-size:22px;line-height:1.5;background:#f7f9fc;padding:22px;border-radius:18px;margin:20px 0}
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{border:0;border-radius:15px;padding:16px;font-size:17px;font-weight:bold;cursor:pointer;background:#e9eef7}
button:hover{transform:scale(1.02)}
.feedback{margin-top:18px;padding:16px;border-radius:15px;font-size:18px;display:none}
.correct{background:#dff5e5;color:#176b35}
.incorrect{background:#ffe3e3;color:#9b2525}
.next{background:#2457a6;color:white;margin-top:15px;width:100%;display:none}
.score{text-align:center;font-size:20px;margin:15px}
.start{text-align:center}
.start button{background:#2457a6;color:white;font-size:20px;padding:18px 35px}
.rules{background:#fff8dc;padding:16px;border-radius:15px;margin:20px 0}
@media(max-width:650px){.options{grid-template-columns:1fr}.example{font-size:19px}}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>🕵️ Detectives de textos</h1>
<p class="subtitle">4° grado · ¿Qué tipo de organización tiene este texto?</p>
<div id="start" class="start">
<div class="rules">
<b>¿Cómo jugar?</b><br><br>
Lee cada ejemplo con atención y elige una opción:
<b>Problema-solución</b>, <b>Causa-consecuencia</b>, <b>Comparación-contraste</b> o <b>Enumeración</b>.
</div>
<button onclick="startGame()">🚀 ¡Comenzar!</button>
</div>
<div id="game" style="display:none">
<div class="score">⭐ Pregunta <span id="num">1</span>/12 · Puntos: <span id="score">0</span></div>
<div class="badge" id="label">Reto</div>
<div class="example" id="example"></div>
<div class="options">
<button onclick="answer('problema')">🛠️ Problema-solución</button>
<button onclick="answer('causa')">🔗 Causa-consecuencia</button>
<button onclick="answer('comparacion')">⚖️ Comparación-contraste</button>
<button onclick="answer('enumeracion')">📋 Enumeración</button>
</div>
<div id="feedback" class="feedback"></div>
<button id="next" class="next" onclick="nextQuestion()">➡️ Siguiente</button>
</div>
<div id="end" style="display:none;text-align:center">
<h2>🎉 ¡Reto terminado!</h2>
<p id="result" style="font-size:23px"></p>
<p id="message" style="font-size:19px"></p>
<button onclick="startGame()" style="background:#2457a6;color:white">🔄 Jugar otra vez</button>
</div>
</div>
</div>
<script>
const qs=[
{t:'problema',x:'En la escuela se desperdicia mucha agua porque algunos estudiantes dejan abiertas las llaves. Para solucionarlo, se colocarán carteles cerca de los lavabos y se organizarán turnos para revisar que las llaves queden cerradas.'},
{t:'causa',x:'Durante varios días llovió intensamente. Como consecuencia, algunas calles se inundaron y el tránsito de vehículos se volvió más lento.'},
{t:'comparacion',x:'Los perros y los gatos son animales domésticos. Los perros suelen ser más sociables y necesitan salir a caminar, mientras que los gatos suelen ser más independientes y pueden permanecer dentro de casa.'},
{t:'enumeracion',x:'Para cuidar nuestra salud podemos realizar varias acciones: 1) comer frutas y verduras, 2) tomar suficiente agua, 3) dormir bien y 4) realizar actividad física.'},
{t:'problema',x:'A varios alumnos les cuesta organizar sus útiles y con frecuencia pierden tiempo buscando sus materiales. Una solución es colocar cada objeto en un espacio identificado y preparar la mochila antes de salir de casa.'},
{t:'causa',x:'Mariana no desayunó antes de ir a la escuela. Por esta razón, durante la mañana sintió hambre y tuvo menos energía para realizar sus actividades.'},
{t:'comparacion',x:'La bicicleta y el automóvil sirven para transportarnos. La bicicleta no necesita combustible y contamina menos, mientras que el automóvil permite recorrer distancias largas con mayor rapidez.'},
{t:'enumeracion',x:'En la biblioteca podemos encontrar diferentes tipos de textos: cuentos, poemas, noticias, recetas, enciclopedias y textos informativos.'},
{t:'problema',x:'En el salón hay demasiado ruido durante el trabajo en equipo y esto dificulta que algunos compañeros se concentren. Para mejorar la situación, cada equipo acordará hablar en voz baja y respetar los momentos de trabajo.'},
{t:'causa',x:'Los árboles de una zona fueron talados en gran cantidad. Como consecuencia, disminuyeron los espacios donde algunas aves podían construir sus nidos.'},
{t:'comparacion',x:'El campo y la ciudad tienen características diferentes. En el campo hay más espacios naturales y menos edificios, mientras que en la ciudad existen más construcciones, vehículos y servicios.'},
{t:'enumeracion',x:'Antes de comenzar una exposición debemos seguir varios pasos: elegir el tema, investigar información, organizar las ideas, preparar apoyos visuales y practicar la presentación.'}
];
let i=0,score=0,answered=false;
const names={problema:'Problema-solución',causa:'Causa-consecuencia',comparacion:'Comparación-contraste',enumeracion:'Enumeración'};
function startGame(){i=0;score=0;answered=false;document.getElementById('start').style.display='none';document.getElementById('end').style.display='none';document.getElementById('game').style.display='block';show();}
function show(){document.getElementById('num').textContent=i+1;document.getElementById('score').textContent=score;document.getElementById('example').textContent=qs[i].x;document.getElementById('feedback').style.display='none';document.getElementById('next').style.display='none';answered=false;}
function answer(a){if(answered)return;answered=true;let f=document.getElementById('feedback');if(a===qs[i].t){score+=10;f.className='feedback correct';f.innerHTML='✅ <b>¡Correcto!</b> Este ejemplo corresponde a <b>'+names[qs[i].t]+'</b>.';}else{f.className='feedback incorrect';f.innerHTML='❌ <b>Casi.</b> La respuesta correcta es <b>'+names[qs[i].t]+'</b>.';}f.style.display='block';document.getElementById('score').textContent=score;document.getElementById('next').style.display='block';}
function nextQuestion(){i++;if(i<qs.length)show();else finish();}
function finish(){document.getElementById('game').style.display='none';document.getElementById('end').style.display='block';document.getElementById('result').textContent='Obtuviste '+score+' de 120 puntos.';document.getElementById('message').textContent=score>=100?'🌟 ¡Excelente! Eres un gran detective de textos.':score>=70?'👏 ¡Muy bien! Sigue practicando para identificar todos los tipos.':'💪 ¡Buen esfuerzo! Vuelve a jugar y fíjate en las pistas de cada ejemplo.';}
</script>
</body>
</html>
